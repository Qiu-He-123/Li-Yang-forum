    <style id="theme-vars">
/*
 * Pinguo design tokens
 * Brand: Pinguo
 * Domain: Consumer imaging product
 * Style: Restrained, elegant, Apple-inspired
 * Theme mode: light-dark
 * Source language: zh
 * Output language: en
 *
 * Color architecture (two layers):
 *   1. Primitive palette - six categories. brand / background / text / icon
 *      are each a 10-step scale (50 lightest to 900 darkest). state-success and
 *      state-error are functional colors anchored on Apple system colors.
 *      Anchors follow Apple Human Interface Guidelines system colors
 *      (System Blue #007AFF, System Green #34C759, System Red #FF3B30,
 *      system grays / label / background colors).
 *   2. Semantic tokens - :root (light) and .dark map roles onto primitives.
 *      Components and UI kits must only consume the semantic tokens below.
 */

/* @group-priority: brand, background, text, icon, state-success, state-error */

:root {
  /* ===== PRIMITIVE PALETTE ===== */

  /* brand */
  --brand-50: #e8f2ff;
  --brand-100: #cfe5ff;
  --brand-200: #9fcbff;
  --brand-300: #66abff;
  --brand-400: #2e8dff;
  --brand-500: #007aff; /* @primary */
  --brand-600: #0064d6;
  --brand-700: #004fad;
  --brand-800: #003b82;
  --brand-900: #00275a;

  /* background */
  --background-50: #ffffff;
  --background-100: #f7f7fa;
  --background-200: #f2f2f7;
  --background-300: #e5e5ea;
  --background-400: #d1d1d6;
  --background-500: #aeaeb2;
  --background-600: #8e8e93;
  --background-700: #3a3a3c;
  --background-800: #1c1c1e;
  --background-900: #000000;

  /* text */
  --text-50: #f5f5f7;
  --text-100: #e3e3e8;
  --text-200: #c7c7cc;
  --text-300: #aeaeb2;
  --text-400: #8e8e93;
  --text-500: #6e6e73;
  --text-600: #48484a;
  --text-700: #3c3c43;
  --text-800: #1d1d1f;
  --text-900: #000000;

  /* icon */
  --icon-50: #f5f5f7;
  --icon-100: #e5e5ea;
  --icon-200: #d1d1d6;
  --icon-300: #c7c7cc;
  --icon-400: #aeaeb2;
  --icon-500: #8e8e93;
  --icon-600: #6e6e73;
  --icon-700: #48484a;
  --icon-800: #2c2c2e;
  --icon-900: #1d1d1f;

  /* state-success */
  --state-success: #34c759; /* @primary */
  --state-success-dark: #30d158;
  --state-success-surface: #e9f9ee;
  --state-success-foreground: #ffffff;

  /* state-error */
  --state-error: #ff3b30; /* @primary */
  --state-error-dark: #ff453a;
  --state-error-surface: #ffecea;
  --state-error-foreground: #ffffff;

  /* ===== SEMANTIC ROLES ===== */

  /* semantic */
  --background: var(--background-50);
  --foreground: var(--text-800);
  --card: var(--background-50);
  --card-foreground: var(--text-800);
  --popover: var(--background-50);
  --popover-foreground: var(--text-900);

  --primary: var(--brand-500);
  --primary-foreground: var(--background-50);
  --secondary: var(--background-200);
  --secondary-foreground: var(--text-800);
  --muted: var(--background-200);
  --muted-foreground: var(--text-400);
  --accent: var(--background-100);
  --accent-foreground: var(--text-800);
  --destructive: var(--state-error);
  --destructive-foreground: var(--state-error-foreground);
  --success: var(--state-success);
  --success-foreground: var(--state-success-foreground);
  --border: var(--background-300);
  --input: var(--background-400);
  --ring: var(--brand-500);

  --icon: var(--icon-900);
  --icon-muted: var(--icon-500);

  /* chart */
  --chart-1: var(--state-success);
  --chart-2: var(--brand-500);
  --chart-3: #ff9500;
  --chart-4: #5856d6;
  --chart-5: #af52de;

  /* sidebar */
  --sidebar: var(--background-200);
  --sidebar-foreground: var(--text-800);
  --sidebar-primary: var(--brand-500);
  --sidebar-primary-foreground: var(--background-50);
  --sidebar-accent: var(--background-300);
  --sidebar-accent-foreground: var(--text-800);
  --sidebar-border: var(--background-300);
  --sidebar-ring: var(--brand-500);

  /* TYPOGRAPHY */
  --font-sans: DM Sans, ui-sans-serif, sans-serif, system-ui;
  --font-serif: DM Sans, ui-sans-serif, sans-serif, system-ui;
  --font-mono: JetBrains Mono, monospace;
  --tracking-normal: 0em;

  /* RADIUS */
  --radius: 1.2rem;
  --radius-sm: 0.6rem;
  --radius-md: 0.8rem;
  --radius-lg: 1.2rem;

  /* SHADOWS */
  --shadow-2xs: 0 1px 2px -1px rgba(0, 0, 0, 0.04); /* Hairline */
  --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.04); /* Subtle */
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05), 0 1px 3px -1px rgba(0, 0, 0, 0.05); /* Card */
  --shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.06), 0 1px 2px -1px rgba(0, 0, 0, 0.05); /* Raised */
  --shadow-md: 0 4px 8px -2px rgba(0, 0, 0, 0.06), 0 2px 4px -2px rgba(0, 0, 0, 0.05); /* Card Hover */
  --shadow-lg: 0 8px 24px -8px rgba(0, 0, 0, 0.08), 0 4px 8px -4px rgba(0, 0, 0, 0.05); /* Float */
  --shadow-xl: 0 16px 40px -10px rgba(0, 0, 0, 0.10), 0 8px 16px -8px rgba(0, 0, 0, 0.06); /* Overlay */
  --shadow-2xl: 0 24px 64px -12px rgba(0, 0, 0, 0.12); /* Modal */

  /* SPACING */
  --spacing: 0.24rem;
}

/* ===== SEMANTIC ROLES - dark (primitive palette inherited) ===== */
.dark {
  --background: var(--background-900);
  --foreground: var(--text-50);
  --card: var(--background-800);
  --card-foreground: var(--text-50);
  --popover: var(--background-700);
  --popover-foreground: var(--text-50);

  --primary: var(--brand-400);
  --primary-foreground: var(--background-900);
  --secondary: var(--background-800);
  --secondary-foreground: var(--text-50);
  --muted: var(--background-800);
  --muted-foreground: var(--text-400);
  --accent: var(--background-700);
  --accent-foreground: var(--text-50);
  --destructive: var(--state-error-dark);
  --destructive-foreground: var(--state-error-foreground);
  --success: var(--state-success-dark);
  --success-foreground: var(--state-success-foreground);
  --border: var(--background-700);
  --input: var(--background-700);
  --ring: var(--brand-400);

  --icon: var(--icon-50);
  --icon-muted: var(--icon-500);

  --chart-1: var(--state-success-dark);
  --chart-2: var(--brand-400);
  --chart-3: #ff9f0a;
  --chart-4: #5e5ce6;
  --chart-5: #bf5af2;

  --sidebar: var(--background-800);
  --sidebar-foreground: var(--text-50);
  --sidebar-primary: var(--brand-400);
  --sidebar-primary-foreground: var(--background-900);
  --sidebar-accent: var(--background-700);
  --sidebar-accent-foreground: var(--text-50);
  --sidebar-border: var(--background-700);
  --sidebar-ring: var(--brand-400);

  --shadow-2xs: 0 1px 2px -1px rgba(0, 0, 0, 0.30);
  --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.30);
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.36), 0 1px 3px -1px rgba(0, 0, 0, 0.36);
  --shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.40), 0 1px 2px -1px rgba(0, 0, 0, 0.36);
  --shadow-md: 0 4px 8px -2px rgba(0, 0, 0, 0.44), 0 2px 4px -2px rgba(0, 0, 0, 0.36);
  --shadow-lg: 0 8px 24px -8px rgba(0, 0, 0, 0.50), 0 4px 8px -4px rgba(0, 0, 0, 0.40);
  --shadow-xl: 0 16px 40px -10px rgba(0, 0, 0, 0.55), 0 8px 16px -8px rgba(0, 0, 0, 0.44);
  --shadow-2xl: 0 24px 64px -12px rgba(0, 0, 0, 0.60);
}

    /* ================================================
       AVATARS (gradient placeholders, copied from v4)
       ================================================ */
    .avatar {

      border-radius: 50%;
      flex-shrink: 0;
    }

    .av-2 { background: linear-gradient(135deg, var(--state-success), var(--brand-400)); }
    .av-3 { background: linear-gradient(135deg, var(--chart-3), var(--brand-500)); }
    .av-4 { background: linear-gradient(135deg, var(--chart-4), var(--brand-600)); }
    .av-5 { background: linear-gradient(135deg, var(--background-400), var(--background-600)); }

    /* ================================================
       PAGE CONTAINER (focused narrow column)
       ================================================ */
    .page-container {
      max-width: 640px;
      margin: 0 auto;
      padding: 18px 16px 32px;
    }

    /* ================================================
       PROFILE HERO (gradient header, in-flow)
       ================================================ */
    .profile-hero {
      position: relative;
      background: linear-gradient(180deg, var(--brand-50) 0%, var(--background-50) 100%);
      border-radius: var(--radius);
      padding: 10px 14px 18px;
      margin-bottom: 12px;
      box-shadow: var(--shadow-xs);
      overflow: hidden;
    }

    .profile-topbar {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 36px;
      margin-bottom: 6px;
    }
    .profile-topbar-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-800);
      letter-spacing: -0.01em;
    }
    .topbar-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      color: var(--text-600);
      transition: background 150ms cubic-bezier(0.32, 0.72, 0, 1),
                  color 150ms cubic-bezier(0.32, 0.72, 0, 1);
    }
    .topbar-btn:hover { background: color-mix(in srgb, var(--background-50) 60%, transparent); color: var(--text-800); }
    .topbar-btn .icon { width: 20px; height: 20px; }
    .topbar-btn svg { width: 20px; height: 20px; display: block; }

    .profile-body {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 10px 0 14px;
    }
    .profile-avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      box-shadow: var(--shadow-xs);
    }
    .profile-name-row {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
    }
    .profile-name {
      font-size: 19px;
      font-weight: 700;
      color: var(--text-800);
      letter-spacing: -0.01em;
      line-height: 1.2;
    }
    .profile-grade {
      display: inline-flex;
      align-items: center;
      height: 18px;
      padding: 0 7px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--brand-500) 12%, var(--background-50));
      color: var(--brand-600);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.01em;
    }
    .profile-signature {
      margin-top: 5px;
      font-size: 13px;
      color: var(--text-500);
      line-height: 1.4;
    }

    .profile-stats {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 14px 0 16px;
    }
    .stat-item {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      flex: 1;
      text-decoration: none;
      color: inherit;
      transition: opacity 150ms cubic-bezier(0.32, 0.72, 0, 1);
    }
    .stat-item:hover { opacity: 0.65; }
    .stat-item:not(:last-child)::after {
      content: '';
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 0.5px;
      height: 26px;
      background: var(--border);
    }
    .stat-num {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-800);
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.01em;
      line-height: 1.1;
    }
    .stat-label {
      font-size: 12px;
      color: var(--text-500);
    }

    .profile-actions {
      position: relative;
      z-index: 1;
      display: flex;
      gap: 10px;
      padding: 0 2px;
    }
    .btn-pill {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 40px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      transition: background 150ms cubic-bezier(0.32, 0.72, 0, 1),
                  color 150ms cubic-bezier(0.32, 0.72, 0, 1),
                  border-color 150ms cubic-bezier(0.32, 0.72, 0, 1),
                  transform 150ms cubic-bezier(0.32, 0.72, 0, 1);
    }
    .btn-pill .icon { width: 15px; height: 15px; }
    .btn-pill svg { width: 15px; height: 15px; display: block; }
    .btn-pill--primary {
      background: var(--brand-500);
      color: var(--background-50);
    }
    .btn-pill--primary:hover { background: var(--brand-600); }
    .btn-pill--outline {
      background: var(--background-100);
      color: var(--text-700);
    }
    .btn-pill--outline:hover { background: var(--background-200); }
    .btn-pill:active { transform: scale(0.98); }

    /* ================================================
       GENERIC CARD (white surface, hairline shadow, no border)
       ================================================ */
    .card {
      background: var(--background-50);
      border-radius: var(--radius);
      box-shadow: var(--shadow-xs);
      margin-bottom: 12px;
      overflow: hidden;
    }
    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px 8px;
    }
    .card-title-text {
      margin: 0;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-800);
      letter-spacing: -0.005em;
    }
    .card-action {
      font-size: 12px;
      color: var(--text-400);
      display: inline-flex;
      align-items: center;
      gap: 2px;
      transition: color 150ms cubic-bezier(0.32, 0.72, 0, 1);
    }
    .card-action:hover { color: var(--brand-500); }
    .card-action .icon { width: 12px; height: 12px; }

    /* ================================================
       MESSAGE NOTIFICATION CENTER (4 entries, unread dots)
       ================================================ */
    .msg-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 6px 8px 16px;
    }
    .msg-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 10px 4px;
      text-decoration: none;
      color: inherit;
      border-radius: var(--radius-sm);
      transition: background 150ms cubic-bezier(0.32, 0.72, 0, 1);
    }
    .msg-item:hover { background: var(--background-100); }
    .msg-icon {
      position: relative;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .msg-icon .icon { width: 21px; height: 21px; }
    .msg-icon--blue   { background: var(--brand-50); color: var(--brand-500); }
    .msg-icon--red    { background: var(--state-error-surface); color: var(--state-error); }
    .msg-icon--green  { background: var(--state-success-surface); color: var(--state-success); }
    .msg-icon--purple { background: color-mix(in srgb, var(--chart-4) 14%, var(--background-50)); color: var(--chart-4); }
    .msg-badge {
      position: absolute;
      top: -3px;
      right: -3px;
      min-width: 17px;
      height: 17px;
      padding: 0 4px;
      border-radius: 999px;
      background: var(--state-error);
      color: var(--background-50);
      font-size: 10px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 0 1.5px var(--background-50);
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .msg-label {
      font-size: 12px;
      color: var(--text-600);
    }

    /* ================================================
       FUNCTION GRID (2 rows x 4 cols, soft squircle icons)
       ================================================ */
    .func-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 2px 0;
      padding: 6px 8px 16px;
    }
    .func-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 9px;
      padding: 10px 4px;
      text-decoration: none;
      color: inherit;
      border-radius: var(--radius-sm);
      transition: background 150ms cubic-bezier(0.32, 0.72, 0, 1);
    }
    .func-item:hover { background: var(--background-100); }
    .func-icon {
      width: 46px;
      height: 46px;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .func-icon .icon { width: 20px; height: 20px; }
    .func-icon--blue   { background: var(--brand-50); color: var(--brand-500); }
    .func-icon--red    { background: var(--state-error-surface); color: var(--state-error); }
    .func-icon--orange { background: color-mix(in srgb, var(--chart-3) 14%, var(--background-50)); color: var(--chart-3); }
    .func-icon--purple { background: color-mix(in srgb, var(--chart-4) 14%, var(--background-50)); color: var(--chart-4); }
    .func-icon--green  { background: var(--state-success-surface); color: var(--state-success); }
    .func-label {
      font-size: 12px;
      color: var(--text-600);
      text-align: center;
      white-space: nowrap;
    }
    .func-item--checkin .func-icon {
      background: var(--state-success-surface);
      color: var(--state-success);
    }

    /* ================================================
       SETTINGS LIST (hairline dividers, no thick border)
       ================================================ */
    .settings-card { padding: 4px 0; }
    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 16px;
      text-decoration: none;
      color: inherit;
      position: relative;
      transition: background 150ms cubic-bezier(0.32, 0.72, 0, 1);
    }
    .settings-row:hover { background: var(--background-100); }
    .settings-row:not(:last-child)::after {
      content: '';
      position: absolute;
      left: 56px;
      right: 16px;
      bottom: 0;
      height: 0.5px;
      background: var(--border);
    }
    .settings-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    .settings-ic {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background: var(--background-100);
      color: var(--text-500);
    }
    .settings-ic .icon { width: 16px; height: 16px; }
    .settings-text {
      font-size: 14px;
      color: var(--text-800);
    }
    .settings-meta {
      font-size: 12px;
      color: var(--text-400);
      margin-right: 4px;
    }
    .settings-arrow {
      width: 16px;
      height: 16px;
      color: var(--text-300);
      flex-shrink: 0;
    }

    .section-gap { height: 4px; }

    /* ================================================
       BOTTOM TAB BAR (mobile only, fixed)
       ================================================ */
    .bottom-tabbar {
      display: flex;
      position: fixed;
      bottom: 14px;
      left: 0;
      right: 0;
      z-index: 100;
      max-width: 460px;
      margin: 0 auto;
      height: 56px;
      padding: 0 10px;
      background: color-mix(in srgb, var(--background-50) 88%, transparent);
      -webkit-backdrop-filter: blur(20px);
      backdrop-filter: blur(20px);
      border: 0.5px solid var(--border);
      border-radius: 26px;
      box-shadow: var(--shadow-lg);
      align-items: stretch;
      justify-content: space-around;
    }
    .bottom-tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      flex: 1;
      color: var(--text-400);
      text-decoration: none;
      transition: color 150ms cubic-bezier(0.32, 0.72, 0, 1);
      min-width: 0;
    }
    .bottom-tab .icon { width: 22px; height: 22px; background-color: currentColor; }
    .bottom-tab-label {
      font-size: 10px;
      line-height: 1;
      white-space: nowrap;
    }
    .bottom-tab.is-active { color: var(--brand-500); }

    .bottom-tab--publish { position: relative; }
    .publish-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--brand-500);
      color: var(--background-50);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: -16px;
      box-shadow: var(--shadow-md);
      transition: transform 150ms cubic-bezier(0.32, 0.72, 0, 1);
    }
    .publish-btn .icon { width: 20px; height: 20px; background-color: currentColor; }
    .bottom-tab--publish:active .publish-btn { transform: scale(0.94); }

    /* ================================================
       RESPONSIVE — Mobile (<768px)
       ================================================ */
    @media (max-width: 768px) {
      body {
        padding-bottom: calc(52px + env(safe-area-inset-bottom) + 8px);
      }
      .page-container { padding: 12px 12px 24px; }
      .profile-hero { padding: 8px 12px 16px; }
      .profile-avatar { width: 60px; height: 60px; }
      .profile-name { font-size: 18px; }
      .stat-num { font-size: 17px; }
      .msg-grid, .func-grid { padding: 6px 4px 14px; }
      .msg-icon, .func-icon { width: 44px; height: 44px; }
      .msg-icon .icon, .func-icon .icon { width: 20px; height: 20px; }
      /* Bottom tabbar: full-width docked on mobile */
      .bottom-tabbar {
        max-width: 100%;
        bottom: 0;
        border-radius: 0;
        border-left: none;
        border-right: none;
        border-bottom: none;
        box-shadow: var(--shadow-lg);
        height: calc(52px + env(safe-area-inset-bottom));
        padding-bottom: env(safe-area-inset-bottom);
      }
    }

    /* ================================================
       REDUCED MOTION
       ================================================ */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
      }
    }
  </style>
</head>

  <script>
    (function () {
      'use strict';

      // ---- Bottom tab switching (reused from v4) ----
      var bottomTabs = document.querySelectorAll('.bottom-tabbar .bottom-tab');
      bottomTabs.forEach(function (tab) {
        tab.addEventListener('click', function (e) {
          e.preventDefault();
          bottomTabs.forEach(function (t) { t.classList.remove('is-active'); });
          tab.classList.add('is-active');
        });
      });

      // ---- "全部已读" quick toggle for message badges (visual demo) ----
      var readAll = document.querySelector('.card-action');
      if (readAll) {
        readAll.addEventListener('click', function (e) {
          e.preventDefault();
          document.querySelectorAll('.msg-badge').forEach(function (b) {
            b.style.transition = 'opacity 150ms cubic-bezier(0.32, 0.72, 0, 1)';
            b.style.opacity = '0';
          });
        });
      }
    })();
  </script>
