server {
  listen 80;
  server_name _;
  # 隐藏 Nginx 版本号，避免泄露给攻击者
  server_tokens off;

  # 超限统一返回 429，前端/应用层可识别
  limit_req_status 429;
  limit_conn_status 429;
  # 全局并发保护：同 IP 最多 20 个连接
  limit_conn global_conn 20;
  # 隐藏上游框架信息（uvicorn/python），只留 nginx
  proxy_hide_header Server;

  # ============ GZip 压缩（静态资源由 Nginx 直接吐出，必须在此层压缩） ============
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json text/plain
             image/svg+xml application/xml;
  gzip_vary on;

  # 反爬：nginx-ultimate-bad-bot-blocker（拦截坏 UA / 坏来源 / 坏 IP，可疑 bot 限速）
  include /etc/nginx/bots.d/blockbots.conf;
  include /etc/nginx/bots.d/ddos.conf;

  # 上传大小限制（与后端 5MB 上限匹配，含 multipart 开销）
  client_max_body_size 6m;

  # P2：安全响应头（由 conf.d 的 40-security-headers.conf 提供，http 层继承；
  #      带缓存头的子 location 通过 include 重复注入，防止继承中断）
  include /etc/nginx/conf.d/40-security-headers.conf;

  # 安全：公网一律屏蔽 API 调试文档（Swagger/Redoc/OpenAPI 是攻击面地图）
  # 注意 /api/docs 会被 /api/ 前缀剥离转发到后端 /docs，必须在此拦截
  location ~* ^/(api/)?(docs|redoc|openapi\.json)$ {
    return 404;
  }

  # 首页 HTML：绝不缓存（发版后即时生效）
  location = /index.html {
    root /usr/share/nginx/html;
    include /etc/nginx/conf.d/40-security-headers.conf;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }

  # 带 hash 的构建产物（JS/CSS）：文件名不可变，永久缓存 immutable
  location /assets/ {
    root /usr/share/nginx/html;
    include /etc/nginx/conf.d/40-security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # 公开图片：同源反代 MinIO（storage 返回 /minio/* 相对路径）
  location /minio/ {
    proxy_pass http://minio:9000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    include /etc/nginx/conf.d/40-security-headers.conf;
    # uuid 文件名不可变，缓存 30 天
    add_header Cache-Control "public, max-age=2592000" always;
  }

  # 本地存储图片兜底（MinIO 不可用时 /uploads/*）：同样缓存 30 天
  location /uploads/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    include /etc/nginx/conf.d/40-security-headers.conf;
    add_header Cache-Control "public, max-age=2592000" always;
  }

  # APK 下载：独立限频 + 限速 + 限并发，防止刷下载打满带宽
  # （应用层还有验证码 + 每 IP 每小时 5 次 / 每天 20 次的硬限制）
  location = /api/app-download {
    limit_req zone=download_limit burst=3 nodelay;
    limit_conn download_conn 2;
    limit_rate 512k;
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # 覆写 X-Forwarded-For，防止客户端伪造 IP 绕过应用层限流
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  location /api/ {
    limit_req zone=api_limit burst=240 nodelay;
    proxy_pass http://backend:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # 覆写 X-Forwarded-For，防止客户端伪造 IP 绕过应用层限流
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  # 启用 HTTPS 后取消注释（HSTS 防降级中间人）：
  # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  location /ws {
    proxy_pass http://backend:8000/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
