<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048 - 途放Game小游戏</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .back {
            position: fixed;
            top: 20px;
            left: 20px;
            color: #fde68a;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 700;
            padding: 10px 20px;
            border: 3px solid #fbbf24;
            border-radius: 999px;
            background: rgba(251, 191, 36, 0.12);
            transition: all 0.2s;
            z-index: 100;
        }
        .back:hover {
            background: rgba(251, 191, 36, 0.25);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(251, 191, 36, 0.3);
        }

        .orient-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            color: #fde68a;
            font-size: 0.85rem;
            font-weight: 700;
            padding: 10px 18px;
            border: 3px solid #fbbf24;
            border-radius: 999px;
            background: rgba(251, 191, 36, 0.12);
            cursor: pointer;
            transition: all 0.2s;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: inherit;
        }
        .orient-toggle:hover {
            background: rgba(251, 191, 36, 0.25);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(251, 191, 36, 0.3);
        }
        .orient-toggle .icon {
            display: inline-block;
            font-size: 1rem;
            transition: transform 0.3s;
        }
        body.landscape .orient-toggle .icon {
            transform: rotate(90deg);
        }

        body.landscape {
            justify-content: center;
            overflow: hidden;
        }
        body.landscape .game-wrapper {
            transform: rotate(90deg);
            max-width: calc(100vh - 100px);
        }

        .game-wrapper {
            background: rgba(30, 41, 59, 0.7);
            border: 2px solid rgba(251, 191, 36, 0.3);
            border-radius: 24px;
            padding: 30px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4), 0 0 0 1px rgba(251,191,36,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 1.6rem;
            text-align: center;
            margin-bottom: 6px;
            font-weight: 900;
        }
        h1 .accent { color: #fde68a; }

        .status-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }
        .status-item {
            background: #1e293b;
            border: 2px solid #334155;
            border-radius: 12px;
            padding: 8px 16px;
            font-weight: 800;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .status-item .val {
            color: #fde68a;
            font-family: "SF Mono", "Cascadia Code", "Consolas", monospace;
            font-size: 1.1rem;
        }

        .btn {
            padding: 10px 28px;
            border: 3px solid #fbbf24;
            border-radius: 999px;
            background: transparent;
            color: #fde68a;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 16px;
        }
        .btn:hover {
            background: #fbbf24;
            color: #422006;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(251,191,36,0.35);
        }
        .btn.primary {
            background: #fbbf24;
            color: #422006;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            background: #334155;
            padding: 10px;
            border-radius: 14px;
            max-width: 380px;
            width: 100%;
            touch-action: none;
        }
        .cell {
            aspect-ratio: 1;
            background: #1e293b;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            font-weight: 900;
            transition: all 0.15s;
        }
        .cell[data-val="2"] { background: #fef3c7; color: #78350f; }
        .cell[data-val="4"] { background: #fde68a; color: #78350f; }
        .cell[data-val="8"] { background: #fcd34d; color: #fff; }
        .cell[data-val="16"] { background: #fbbf24; color: #fff; }
        .cell[data-val="32"] { background: #f59e0b; color: #fff; }
        .cell[data-val="64"] { background: #d97706; color: #fff; }
        .cell[data-val="128"] { background: #f87171; color: #fff; font-size: 1.3rem; }
        .cell[data-val="256"] { background: #ef4444; color: #fff; font-size: 1.3rem; }
        .cell[data-val="512"] { background: #dc2626; color: #fff; font-size: 1.3rem; }
        .cell[data-val="1024"] { background: #a78bfa; color: #fff; font-size: 1.1rem; }
        .cell[data-val="2048"] { background: #8b5cf6; color: #fff; font-size: 1.1rem; }
        .cell[data-val="4096"] { background: #22c55e; color: #fff; font-size: 1.1rem; }
        .cell.merged { animation: pop 0.2s ease; }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.18); }
            100% { transform: scale(1); }
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.94);
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 10;
        }
        .overlay.show { display: flex; }
        .overlay h2 { font-size: 2rem; margin-bottom: 8px; }
        .overlay p { color: #94a3b8; margin-bottom: 24px; font-size: 1.1rem; }
        .hint { color: #64748b; font-size: 0.85rem; margin-top: 14px; text-align: center; }

        @media (max-width: 500px) {
            .game-wrapper { padding: 20px 14px; }
            .cell { font-size: 1.3rem; }
            .back { top: 10px; left: 10px; font-size: 0.8rem; padding: 8px 14px; }
            .orient-toggle { top: 10px; right: 10px; font-size: 0.75rem; padding: 8px 14px; }
        }
    /* 内嵌适配统一由 /games/embed.css 提供 */
    </style>
    <script>if(self!==top)document.documentElement.classList.add('embed');</script>
    <link rel="stylesheet" href="embed.css" />
</head>
<body>
    <a href="javascript:void(0)" class="back">← 返回</a>
    <button class="orient-toggle" onclick="toggleOrientation()" title="切换横竖屏"><span class="icon">📱</span> <span class="label">横屏</span></button>

    <div class="game-wrapper">
        <h1>🔢 <span class="accent">2048</span></h1>

        <div class="status-bar">
            <div class="status-item">⭐ <span class="val" id="score">0</span></div>
            <div class="status-item">🏆 <span class="val" id="best">0</span></div>
        </div>

        <button class="btn primary" id="newBtn">新游戏</button>

        <div class="board" id="board"></div>

        <p class="hint">方向键/WASD 移动 · 移动端滑动</p>
    </div>

    <div class="overlay" id="overlay">
        <h2>🎉 恭喜！</h2>
        <p>你达到了 <strong id="finalScore">0</strong> 分！</p>
        <button class="btn primary" id="restartBtn">再玩一次</button>
    </div>

    <script>
        function toggleOrientation(){document.body.classList.toggle('landscape');const l=document.querySelector('.orient-toggle .label');l.textContent=document.body.classList.contains('landscape')?'竖屏':'横屏';localStorage.setItem('gameOrient',document.body.classList.contains('landscape')?'landscape':'portrait');}
        (function(){if(localStorage.getItem('gameOrient')==='landscape'){document.body.classList.add('landscape');const l=document.querySelector('.orient-toggle .label');if(l)l.textContent='竖屏';}})();
        const boardEl = document.getElementById('board');
        const scoreEl = document.getElementById('score');
        const bestEl = document.getElementById('best');
        const overlay = document.getElementById('overlay');
        const finalScoreEl = document.getElementById('finalScore');

        let grid = [];
        let score = 0, bestScore = 0;

        try { bestScore = parseInt(localStorage.getItem('tfe_best')) || 0; } catch(e) {}
        bestEl.textContent = bestScore;

        function init() {
            grid = Array.from({ length: 4 }, () => Array(4).fill(0));
            score = 0;
            scoreEl.textContent = '0';
            overlay.classList.remove('show');
            addRandom();
            addRandom();
            render();
        }

        function addRandom() {
            const empty = [];
            for (let r = 0; r < 4; r++)
                for (let c = 0; c < 4; c++)
                    if (grid[r][c] === 0) empty.push({ r, c });
            if (empty.length === 0) return;
            const { r, c } = empty[Math.floor(Math.random() * empty.length)];
            grid[r][c] = Math.random() < 0.9 ? 2 : 4;
        }

        function slide(row) {
            let arr = row.filter(v => v !== 0);
            for (let i = 0; i < arr.length - 1; i++) {
                if (arr[i] === arr[i + 1]) {
                    arr[i] *= 2;
                    score += arr[i];
                    arr[i + 1] = 0;
                }
            }
            arr = arr.filter(v => v !== 0);
            while (arr.length < 4) arr.push(0);
            return arr;
        }

        function move(dir) {
            const old = grid.map(r => [...r]);
            let moved = false;

            if (dir === 'left') {
                for (let r = 0; r < 4; r++) {
                    const newRow = slide(grid[r]);
                    if (newRow.join(',') !== grid[r].join(',')) moved = true;
                    grid[r] = newRow;
                }
            } else if (dir === 'right') {
                for (let r = 0; r < 4; r++) {
                    const reversed = [...grid[r]].reverse();
                    const newRow = slide(reversed).reverse();
                    if (newRow.join(',') !== grid[r].join(',')) moved = true;
                    grid[r] = newRow;
                }
            } else if (dir === 'up') {
                for (let c = 0; c < 4; c++) {
                    const col = [grid[0][c], grid[1][c], grid[2][c], grid[3][c]];
                    const newCol = slide(col);
                    for (let r = 0; r < 4; r++) {
                        if (grid[r][c] !== newCol[r]) moved = true;
                        grid[r][c] = newCol[r];
                    }
                }
            } else if (dir === 'down') {
                for (let c = 0; c < 4; c++) {
                    const col = [grid[3][c], grid[2][c], grid[1][c], grid[0][c]];
                    const newCol = slide(col).reverse();
                    for (let r = 0; r < 4; r++) {
                        if (grid[r][c] !== newCol[r]) moved = true;
                        grid[r][c] = newCol[r];
                    }
                }
            }

            if (moved) {
                addRandom();
                scoreEl.textContent = score;
                if (score > bestScore) {
                    bestScore = score;
                    bestEl.textContent = bestScore;
                    try { localStorage.setItem('tfe_best', bestScore); } catch(e) {}
                }
                render();
                if (isGameOver()) {
                    setTimeout(() => {
                        finalScoreEl.textContent = score;
                        overlay.classList.add('show');
                    }, 300);
                }
            }
        }

        function isGameOver() {
            for (let r = 0; r < 4; r++)
                for (let c = 0; c < 4; c++) {
                    if (grid[r][c] === 0) return false;
                    if (r < 3 && grid[r][c] === grid[r + 1][c]) return false;
                    if (c < 3 && grid[r][c] === grid[r][c + 1]) return false;
                }
            return true;
        }

        function render() {
            boardEl.innerHTML = '';
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    const el = document.createElement('div');
                    el.className = 'cell';
                    if (grid[r][c] > 0) {
                        el.textContent = grid[r][c];
                        el.dataset.val = grid[r][c];
                    }
                    boardEl.appendChild(el);
                }
            }
        }

        // Keyboard
        document.addEventListener('keydown', e => {
            const key = e.key;
            if (key === 'ArrowLeft' || key === 'a' || key === 'A') move('left');
            if (key === 'ArrowRight' || key === 'd' || key === 'D') move('right');
            if (key === 'ArrowUp' || key === 'w' || key === 'W') move('up');
            if (key === 'ArrowDown' || key === 's' || key === 'S') move('down');
        });

        // Touch
        let touchStartX = 0, touchStartY = 0;
        boardEl.addEventListener('touchstart', e => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, { passive: true });
        boardEl.addEventListener('touchend', e => {
            const dx = e.changedTouches[0].clientX - touchStartX;
            const dy = e.changedTouches[0].clientY - touchStartY;
            const absDx = Math.abs(dx), absDy = Math.abs(dy);
            if (Math.max(absDx, absDy) < 30) return;
            if (absDx > absDy) move(dx > 0 ? 'right' : 'left');
            else move(dy > 0 ? 'down' : 'up');
        });

        document.getElementById('newBtn').addEventListener('click', init);
        document.getElementById('restartBtn').addEventListener('click', init);
        init();
    </script>
</body>
</html>
