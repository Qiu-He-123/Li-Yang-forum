<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>打地鼠 - 途放Game小游戏</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            user-select: none;
        }
        .back {
            position: fixed;
            top: 20px;
            left: 20px;
            color: #fca5a5;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 700;
            padding: 10px 20px;
            border: 3px solid #f87171;
            border-radius: 999px;
            background: rgba(248, 113, 113, 0.12);
            transition: all 0.2s;
            z-index: 100;
        }
        .back:hover {
            background: rgba(248, 113, 113, 0.25);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(248, 113, 113, 0.3);
        }

        .orient-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            color: #fca5a5;
            font-size: 0.85rem;
            font-weight: 700;
            padding: 10px 18px;
            border: 3px solid #f87171;
            border-radius: 999px;
            background: rgba(248, 113, 113, 0.12);
            cursor: pointer;
            transition: all 0.2s;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: inherit;
        }
        .orient-toggle:hover {
            background: rgba(248, 113, 113, 0.25);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(248, 113, 113, 0.3);
        }
        .orient-toggle .icon {
            display: inline-block;
            font-size: 1rem;
            transition: transform 0.3s;
        }
        body.landscape .orient-toggle .icon {
            transform: rotate(90deg);
        }

        body.landscape {
            justify-content: center;
            overflow: hidden;
        }
        body.landscape .game-wrapper {
            transform: rotate(90deg);
            max-width: calc(100vh - 100px);
        }

        .game-wrapper {
            background: rgba(30, 41, 59, 0.7);
            border: 2px solid rgba(248, 113, 113, 0.3);
            border-radius: 24px;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4), 0 0 0 1px rgba(248,113,113,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 1.6rem;
            text-align: center;
            margin-bottom: 6px;
            font-weight: 900;
        }
        h1 .accent { color: #fca5a5; }

        .status-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }
        .status-item {
            background: #1e293b;
            border: 2px solid #334155;
            border-radius: 12px;
            padding: 8px 16px;
            font-weight: 800;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .status-item .val {
            color: #fca5a5;
            font-family: "SF Mono", "Cascadia Code", "Consolas", monospace;
            font-size: 1.1rem;
        }

        .btn {
            padding: 10px 28px;
            border: 3px solid #f87171;
            border-radius: 999px;
            background: transparent;
            color: #fca5a5;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 20px;
        }
        .btn:hover {
            background: #f87171;
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(248,113,113,0.35);
        }
        .btn.primary {
            background: #f87171;
            color: #fff;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            max-width: 360px;
            width: 100%;
        }
        .hole {
            aspect-ratio: 1;
            background: #1e293b;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.8rem;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            border: 3px solid #334155;
            transition: all 0.15s;
        }
        .hole.active { background: #3b1a1a; border-color: #f87171; }
        .hole:active { transform: scale(0.94); }
        .hole .mole { user-select: none; }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.94);
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 10;
        }
        .overlay.show { display: flex; }
        .overlay h2 { font-size: 2rem; margin-bottom: 8px; }
        .overlay p { color: #94a3b8; margin-bottom: 24px; font-size: 1.1rem; }

        @media (max-width: 500px) {
            .game-wrapper { padding: 20px 14px; }
            .back { top: 10px; left: 10px; font-size: 0.8rem; padding: 8px 14px; }
            .orient-toggle { top: 10px; right: 10px; font-size: 0.75rem; padding: 8px 14px; }
            .hole { font-size: 2.2rem; }
        }
    /* 内嵌适配统一由 /games/embed.css 提供 */
    </style>
    <script>if(self!==top)document.documentElement.classList.add('embed');</script>
    <link rel="stylesheet" href="embed.css" />
</head>
<body>
    <a href="javascript:void(0)" class="back">← 返回</a>
    <button class="orient-toggle" onclick="toggleOrientation()" title="切换横竖屏"><span class="icon">📱</span> <span class="label">横屏</span></button>

    <div class="game-wrapper">
        <h1>🔨 <span class="accent">打地鼠</span></h1>

        <div class="status-bar">
            <div class="status-item">⭐ <span class="val" id="score">0</span></div>
            <div class="status-item">⏱ <span class="val" id="time">30</span>s</div>
        </div>

        <button class="btn primary" id="startBtn">开始游戏</button>

        <div class="grid" id="grid"></div>
    </div>

    <div class="overlay" id="overlay">
        <h2>游戏结束！</h2>
        <p>最终得分：<strong id="finalScore">0</strong></p>
        <button class="btn primary" id="restartBtn">再玩一次</button>
    </div>

    <script>
        function toggleOrientation(){document.body.classList.toggle('landscape');const l=document.querySelector('.orient-toggle .label');l.textContent=document.body.classList.contains('landscape')?'竖屏':'横屏';localStorage.setItem('gameOrient',document.body.classList.contains('landscape')?'landscape':'portrait');}
        (function(){if(localStorage.getItem('gameOrient')==='landscape'){document.body.classList.add('landscape');const l=document.querySelector('.orient-toggle .label');if(l)l.textContent='竖屏';}})();
        const grid = document.getElementById('grid');
        const scoreEl = document.getElementById('score');
        const timeEl = document.getElementById('time');
        const startBtn = document.getElementById('startBtn');
        const overlay = document.getElementById('overlay');
        const finalScoreEl = document.getElementById('finalScore');
        const restartBtn = document.getElementById('restartBtn');

        let score = 0, time = 30, gameRunning = false, moleTimer = null, countdownTimer = null;
        const holes = [];
        let currentMole = -1;

        function createGrid() {
            grid.innerHTML = '';
            for (let i = 0; i < 9; i++) {
                const hole = document.createElement('div');
                hole.className = 'hole';
                hole.addEventListener('click', () => whack(i));
                holes.push(hole);
                grid.appendChild(hole);
            }
        }

        function showMole() {
            if (!gameRunning) return;
            // Clear prev
            if (currentMole >= 0) {
                holes[currentMole].classList.remove('active');
                holes[currentMole].innerHTML = '';
            }
            currentMole = Math.floor(Math.random() * 9);
            holes[currentMole].classList.add('active');
            holes[currentMole].innerHTML = '<span class="mole">🐹</span>';

            moleTimer = setTimeout(() => {
                if (holes[currentMole]) {
                    holes[currentMole].classList.remove('active');
                    holes[currentMole].innerHTML = '';
                }
                currentMole = -1;
                if (gameRunning) showMole();
            }, 800 + Math.random() * 600);
        }

        function whack(i) {
            if (!gameRunning) return;
            if (i === currentMole && holes[i].classList.contains('active')) {
                score++;
                scoreEl.textContent = score;
                holes[i].classList.remove('active');
                holes[i].innerHTML = '<span class="mole">💥</span>';
                clearTimeout(moleTimer);
                currentMole = -1;
                setTimeout(() => {
                    if (holes[i]) holes[i].innerHTML = '';
                    if (gameRunning) showMole();
                }, 200);
            }
        }

        function startGame() {
            score = 0; time = 30;
            scoreEl.textContent = '0';
            timeEl.textContent = '30';
            gameRunning = true;
            overlay.classList.remove('show');
            startBtn.style.display = 'none';

            if (currentMole >= 0 && holes[currentMole]) {
                holes[currentMole].classList.remove('active');
                holes[currentMole].innerHTML = '';
            }
            currentMole = -1;
            showMole();

            countdownTimer = setInterval(() => {
                time--;
                timeEl.textContent = time;
                if (time <= 0) endGame();
            }, 1000);
        }

        function endGame() {
            gameRunning = false;
            clearTimeout(moleTimer);
            clearInterval(countdownTimer);
            if (currentMole >= 0 && holes[currentMole]) {
                holes[currentMole].classList.remove('active');
                holes[currentMole].innerHTML = '';
            }
            currentMole = -1;
            startBtn.style.display = '';
            finalScoreEl.textContent = score;
            overlay.classList.add('show');
        }

        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);
        createGrid();
    </script>
</body>
</html>
