# 立洋社区 API 限流：每 IP 每分钟最多 120 次 /api 请求（读+写）
# 在 frontend/nginx.conf 的 location /api/ 中引用 zone=api_limit
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=120r/m;

# APK 下载专用限流：每 IP 每分钟最多 6 次（防刷下载）
limit_req_zone $binary_remote_addr zone=download_limit:10m rate=6r/m;

# APK 下载专用并发限制：同 IP 最多 2 个并发下载连接
limit_conn_zone $binary_remote_addr zone=download_conn:10m;

# 全局并发保护：同 IP 最多 20 个并发连接（防慢速连接 / 连接洪泛）
limit_conn_zone $binary_remote_addr zone=global_conn:10m;
