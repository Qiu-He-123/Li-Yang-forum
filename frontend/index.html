<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>立洋校园社区</title>
    <style>
      /* ============ 启动预加载遮罩 ============
       * 参考"心伴网页_新"的写法：页面一加载就显示全屏遮罩，
       * 持续到 Vue 挂载 + 初始会话校验完成后才移除。
       * 这样可以遮住 Vue 挂载前的空白、路由组件 onMounted 异步加载前的"帖子已删除"闪烁等问题。
       */
      html, body {
        margin: 0;
        padding: 0;
        background: #f5f5f7;
      }
      #app-preloader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: #f5f5f7;
        transition: opacity 0.3s ease, visibility 0.3s ease;
      }
      #app-preloader.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #app-preloader .preloader-spinner {
        width: 36px;
        height: 36px;
        border: 3px solid #e5e5ea;
        border-top-color: #34c759;
        border-radius: 50%;
        animation: ly-preloader-spin 0.7s linear infinite;
      }
      #app-preloader .preloader-text {
        margin-top: 14px;
        font-size: 14px;
        color: #8e8e93;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      @keyframes ly-preloader-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <!-- 启动预加载遮罩：在 Vue 挂载完成前持续显示，避免空白 / 闪烁 -->
    <div id="app-preloader">
      <div class="preloader-spinner"></div>
      <p class="preloader-text">加载中…</p>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
