services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: lycommunity
      MYSQL_DATABASE: ly_community
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  backend:
    build: ../backend
    env_file:
      - ../backend/.env
    environment:
      DATABASE_URL: mysql+pymysql://root:lycommunity@mysql:3306/ly_community
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - mysql
      - redis
      - minio
    ports:
      - "8000:8000"

  frontend:
    build: ../frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  mysql_data:
  minio_data:

